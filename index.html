<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاذاة زرق الكانيولا | اللعبة التعليمية الفضائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 900;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* شاشات اللعبة */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* حقل ادخال الاسم */
        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #030712;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.6);
        }

        /* صندوق الملاحظات التوضيحية المستمرة */
        .tips-box {
            background: rgba(56, 189, 248, 0.1);
            border-right: 4px solid #38bdf8;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 0.9rem;
            color: #e2e8f0;
            animation: pulseTip 2s infinite;
        }

        @keyframes pulseTip {
            0% { border-color: #38bdf8; }
            50% { border-color: #818cf8; }
            100% { border-color: #38bdf8; }
        }

        /* منطقة التحدي والخيارات الطبية */
        .question-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 14px;
            color: #cbd5e1;
            font-size: 1rem;
            cursor: pointer;
            text-align: right;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #fff;
            transform: translateX(-5px);
        }

        /* لوحة الشرف */
        .leaderboard-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: right;
        }

        .leaderboard-item {
            background: rgba(30, 41, 59, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-badge {
            background: #38bdf8;
            color: #030712;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="game-container">
        
        <!-- الشاشة الأولى: تسجيل الاسم -->
        <div id="screen-start" class="screen active">
            <h1>محاكاة زرق الكانيولا الطبية 💉</h1>
            <p class="subtitle">اختبر مهاراتك الإكلينيكية واجمع النقاط في بيئة الفضاء الأكاديمي</p>
            
            <div class="input-group">
                <input type="text" id="player-name" placeholder="أدخل اسمك الباحث الكريم..." autocomplete="off">
            </div>
            <button class="btn" onclick="startGame()">ابدأ التحدي 🚀</button>
        </div>

        <!-- الشاشة الثانية: اللعبة والأسئلة التفاعلية -->
        <div id="screen-game" class="screen">
            <div class="tips-box" id="educational-tip">
                💡 <strong>ملاحظة تعليمية:</strong> جاري تحميل التوجيهات الطبية...
            </div>

            <div class="question-title" id="q-title">السؤال الأول...</div>
            <div class="options-grid" id="q-options">
                <!-- الخيارات تتولد ديناميكياً -->
            </div>
            <div style="color: #38bdf8; font-weight: bold; font-size: 1.1rem;">النقاط الحالية: <span id="current-score">0</span></div>
        </div>

        <!-- الشاشة الثالثة: النتائج ولوحة الشرف -->
        <div id="screen-end" class="screen">
            <h1>🎉 أتممت المهمة بنجاح!</h1>
            <p class="subtitle">لقد أنهيت محاكاة زرق الكانيولا بجدارة.</p>
            
            <h3 style="color: #38bdf8; margin-bottom: 10px;">🏆 لوحة الشرف الفضائية</h3>
            <ul class="leaderboard-list" id="leaderboard">
                <!-- يتم جلب البيانات هنا -->
            </ul>

            <button class="btn" onclick="location.reload()">إعادة المحاولة 🔄</button>
        </div>

    </div>

    <script>
        // خلفية الفضاء المتحركة
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5,
            alpha: Math.random(),
            speed: Math.random() * 0.15 + 0.05
        }));

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.y -= star.speed;
                if (star.y < 0) star.y = height;
            });
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // منطق اللعبة
        let playerName = "";
        let score = 0;
        let currentQuestion = 0;

        const questions = [
            {
                tip: "تأكد دائماً من تعقيم مكان الإدخال بحركة دائرية من المركز إلى الخارج لمدة لا تقل عن 30 ثانية.",
                title: "ما هي أفضل زاوية لإدخال الإبرة (الكانيولا) في الوريد الظهري لليد؟",
                options: [
                    { text: "زاوية 15 إلى 30 درجة مع اتجاه الوريد", correct: true, pts: 20 },
                    { text: "زاوية قائمة 90 درجة تماماً", correct: false, pts: 0 },
                    { text: "زاوية أفقية تماماً 0 درجة موازية للجلد", correct: false, pts: 5 }
                ]
            },
            {
                tip: "ربط التورنيكيه (Tourniquet) يجب ألا يتجاوز دقيقة إلى دقيقتين لمنع احتقان الدم وتلف الأنسجة.",
                title: "أين يجب ربط التورنيكيه بالنسبة لموقع البزل المقترح؟",
                options: [
                    { text: "أعلى مكان البزل بحوالي 7 إلى 10 سم", correct: true, pts: 20 },
                    { text: "تحت مكان البزل مباشرة", correct: false, pts: 0 },
                    { text: "حول المعصم بغض النظر عن الوريد", correct: false, pts: 5 }
                ]
            },
            {
                tip: "ظهور عودة الدم (Flashback) في حجرة الكانيولا يؤكد نجاح الدخول داخل تجويف الوريد.",
                title: "ما هو التصرف الفوري الصحيح بمجرد رؤية تدفق الدم في غرفة الكانيولا؟",
                options: [
                    { text: "خفض زاوية الإدخال قليلاً ودفع القسطرة البلاستيكية للأمام وسحب الإبرة المعدنية", correct: true, pts: 30 },
                    { text: "دفع الإبرة المعدنية بشكل كامل وسريع للداخل", correct: false, pts: 0 },
                    { text: "سحب الكانيولا بالكامل فوراً", correct: false, pts: 0 }
                ]
            },
            {
                tip: "تجنب الأوردة الموجودة بالقرب من المفاصل أو الصمامات لتفادي تسرب السوائل أو الألم المزمن للمريضة.",
                title: "عند اختيار الوريد لعمليات القيصرية، ما هي الأوردة الأفضل تفضيلاً بالبداية؟",
                options: [
                    { text: "أوردة ظهر اليد والساعد (Dorsal & Forearm veins)", correct: true, pts: 30 },
                    { text: "أوردة منطقة الرقبة الظاهرة", correct: false, pts: 0 },
                    { text: "الأوردة المجاورة للشرايين مباشرة", correct: false, pts: 0 }
                ]
            }
        ];

        function startGame() {
            const input = document.getElementById('player-name');
            if (!input.value.trim()) {
                alert("يرجى كتابة اسمك الكريم أولاً لبدء التحدي!");
                return;
            }
            playerName = input.value.trim();
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            const q = questions[currentQuestion];
            document.getElementById('educational-tip').innerHTML = `💡 <strong>ملاحظة تعليمية:</strong> ${q.tip}`;
            document.getElementById('q-title').innerText = `(${currentQuestion + 1}/${questions.length}) ${q.title}`;
            
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.correct, opt.pts);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(isCorrect, pts) {
            if (isCorrect) {
                score += pts;
                document.getElementById('current-score').innerText = score;
            }
            currentQuestion++;
            loadQuestion();
        }

        function endGame() {
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-end').classList.add('active');
            
            // حفظ النتيجة محلياً وإضافتها للوحة الشرف
            let leaderboard = JSON.parse(localStorage.getItem('space_leaderboard') || '[]');
            leaderboard.push({ name: playerName, score: score });
            leaderboard.sort((a, b) => b.score - a.score);
            localStorage.setItem('space_leaderboard', JSON.stringify(leaderboard));

            // عرض لوحة الشرف
            const listEl = document.getElementById('leaderboard');
            listEl.innerHTML = '';
            leaderboard.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `<span>#${index + 1} ${item.name}</span> <span class="score-badge">${item.score} نقطة</span>`;
                listEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
