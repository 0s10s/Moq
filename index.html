<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي زرق الكانيولا 3D | Build #100</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --cyan: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --panel: rgba(15, 23, 42, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background-color: var(--bg); color: #f8fafc; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #canvas-container { position: absolute; inset: 0; z-index: 1; }

        /* واجهة المستخدم العلوية HUD */
        .hud {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 15px; background: var(--panel);
            backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .hud-item { font-size: 0.9rem; font-weight: 700; color: #94a3b8; }
        .hud-item span { color: var(--cyan); }

        /* غيمة الملاحظات الطافية (Floating Cloud Notification) */
        .cloud-notification {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px); border: 2px solid var(--cyan);
            padding: 12px 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
            text-align: center; max-width: 450px; animation: cloudPulse 2s infinite ease-in-out;
            transition: all 0.3s ease;
        }
        .cloud-title { font-size: 0.95rem; font-weight: 900; color: var(--cyan); margin-bottom: 2px; }
        .cloud-desc { font-size: 0.85rem; color: #e2e8f0; line-height: 1.4; }

        @keyframes cloudPulse {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* لوحة التحكم السفلية */
        .controls-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: var(--panel); backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 15px 25px; border-radius: 20px;
            display: flex; gap: 12px; align-items: center; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            flex-wrap: wrap; justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, var(--cyan), #2563eb); color: #020617;
            border: none; padding: 10px 22px; border-radius: 50px; font-weight: 800; font-size: 0.95rem;
            cursor: pointer; transition: all 0.25s; box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #94a3b8; }
        input[type="range"] { accent-color: var(--cyan); width: 130px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- واجهة المراقبة الحيوية -->
    <div class="hud">
        <div class="hud-item">الخطوة: <span id="hud-step">1 / 4</span></div>
        <div class="hud-item">النقاط: <span id="hud-score">0</span></div>
    </div>

    <!-- غيمة الملاحظات الطافية -->
    <div class="cloud-notification" id="cloud-box">
        <div class="cloud-title" id="cloud-title">الخطوة 1: التعقيم والقفازات 🧤</div>
        <div class="cloud-desc" id="cloud-desc">انقر على الزر أدناه لارتداء القفازات المعقمة قبل بدء الإجراء الطبي.</div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- لوحة التحكم التفاعلية -->
    <div class="controls-panel" id="action-controls">
        <button class="btn" id="action-btn" onclick="nextStep()">ارتداء القفازات 🧤</button>
    </div>

    <!-- استيراد مكتبات Three.js عبر CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. إعداد مشهد الـ 3D (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.FogExp2(0x030712, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // إضاءة صالة العمليات الفضائية
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x818cf8, 1.5, 10);
        pointLight.position.set(0, 3, 2);
        scene.add(pointLight);

        // --- 2. بناء مجسم الذراع والأوردة 3D ---
        const armGroup = new THREE.Group();
        scene.add(armGroup);

        // الذراع البشري
        const armGeo = new THREE.CylinderGeometry(0.8, 0.9, 5, 32);
        const armMat = new THREE.MeshStandardMaterial({ color: 0xd89d7c, roughness: 0.6 });
        const armMesh = new THREE.Mesh(armGeo, armMat);
        armMesh.rotation.z = Math.PI / 2;
        armMesh.castShadow = true;
        armMesh.receiveShadow = true;
        armGroup.add(armMesh);

        // تورنيكيه ثلاثي الأبعاد (مخفي بالبداية)
        const tourniquetGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.4, 32);
        const tourniquetMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 });
        const tourniquetMesh = new THREE.Mesh(tourniquetGeo, tourniquetMat);
        tourniquetMesh.rotation.z = Math.PI / 2;
        tourniquetMesh.position.x = 1.2;
        tourniquetMesh.visible = false;
        armGroup.add(tourniquetMesh);

        // الأوردة (قابل للنقر عبر Raycaster)
        const veinGroup = new THREE.Group();
        armGroup.add(veinGroup);

        const veinMat = new THREE.MeshBasicMaterial({ color: 0x2563eb });
        const arteryMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 }); // شريان خطير

        // وريد 1 (الوريد المثالي Cephalic)
        const vein1Geo = new THREE.CylinderGeometry(0.12, 0.12, 3.2, 16);
        const vein1 = new THREE.Mesh(vein1Geo, veinMat);
        vein1.rotation.z = Math.PI / 2;
        vein1.position.set(-0.2, 0.35, 0);
        vein1.userData = { type: 'correct', name: 'الوريد الكعبري (Cephalic Vein)' };
        veinGroup.add(vein1);

        // شريان (خاطئ)
        const artGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.2, 16);
        const artery = new THREE.Mesh(artGeo, arteryMat);
        artery.rotation.z = Math.PI / 2;
        artery.position.set(-0.2, -0.35, 0);
        artery.userData = { type: 'wrong', name: 'الشريان الكعبري النابض (خطر!)' };
        veinGroup.add(artery);

        // الكانيولا / الإبرة 3D
        const cannulaGroup = new THREE.Group();
        scene.add(cannulaGroup);
        cannulaGroup.visible = false;

        const needleGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.8, 16);
        const needleMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.1 });
        const needleMesh = new THREE.Mesh(needleGeo, needleMat);
        needleMesh.rotation.z = Math.PI / 2;
        cannulaGroup.add(needleMesh);

        // حجرة ومضة الدم (Flashback Chamber)
        const flashGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 16);
        const flashMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, transparent: true, opacity: 0.2 });
        const flashMesh = new THREE.Mesh(flashGeo, flashMat);
        flashMesh.rotation.z = Math.PI / 2;
        flashMesh.position.x = 0.9;
        cannulaGroup.add(flashMesh);

        // --- 3. منطق اللعبة والخطوات (State Machine) ---
        let gameState = {
            step: 1,
            score: 0,
            gloves: false,
            tourniquet: false,
            veinSelected: false,
            angle: 20
        };

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (gameState.step === 3) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(veinGroup.children);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData.type === 'correct') {
                        gameState.veinSelected = true;
                        gameState.score += 250;
                        updateCloud('✔ اختيار ممتاز!', `تم تحديد ${hit.userData.name} بنجاح. الأوردة السطحية هنا مثالية للعمليات القيصرية.`);
                        document.getElementById('action-btn').disabled = false;
                        document.getElementById('action-btn').innerText = "الانتقال لزاوية الوخز 📐";
                    } else {
                        updateCloud('🚨 خطأ تشريحي خطير!', `هذا ${hit.userData.name}! وعاء نابض تحت ضغط عالٍ، يُمنع البزل فيه بتاتاً.`);
                    }
                }
            }
        });

        function updateCloud(title, desc) {
            document.getElementById('cloud-title').innerText = title;
            document.getElementById('cloud-desc').innerText = desc;
        }

        function nextStep() {
            if (gameState.step === 1) {
                gameState.gloves = true;
                gameState.score += 150;
                gameState.step = 2;
                updateCloud('الخطوة 2: ربط التورنيكيه 🎗️', 'تم ارتداء القفازات بنجاح. انقر الآن لربط التورنيكيه 7–10 سم أعلى الموقع لإبراز الأوردة.');
                document.getElementById('action-btn').innerText = "ربط التورنيكيه 🎗️";
            } else if (gameState.step === 2) {
                gameState.tourniquet = true;
                tourniquetMesh.visible = true;
                gameState.score += 150;
                gameState.step = 3;
                updateCloud('الخطوة 3: جس واختيار الوريد 🔍', 'انقر بالماوس مباشرة على الوريد الصحيح (الأزرق العلوي) على ذراع المريضة 3D.');
                document.getElementById('action-btn').innerText = "اختر الوريد على الذراع أولاً";
                document.getElementById('action-btn').disabled = true;
            } else if (gameState.step === 3) {
                gameState.step = 4;
                cannulaGroup.visible = true;
                updateCloud('الخطوة 4: زاوية الإدخال والـ Flashback 📐', 'استخدم المنزلق أدناه لضبط زاوية الوخز (15° - 30°) ثم اضغط إتمام الوخز.');
                document.getElementById('action-controls').innerHTML = `
                    <div class="slider-group">
                        <label>الزاوية: <b id="ang-txt" style="color:var(--cyan);">20°</b></label>
                        <input type="range" min="10" max="50" value="20" oninput="adjustAngle(this.value)">
                    </div>
                    <button class="btn" onclick="completeInsertion()">إتمام الإدخال ومراقبة ومضة الدم 💉</button>
                `;
            } else if (gameState.step === 5) {
                location.reload();
            }

            document.getElementById('hud-step').innerText = Math.min(gameState.step, 4) + " / 4";
            document.getElementById('hud-score').innerText = gameState.score;
        }

        function adjustAngle(val) {
            gameState.angle = Number(val);
            document.getElementById('ang-txt').innerText = val + "°";
            cannulaGroup.rotation.z = (val * Math.PI) / 180;
            cannulaGroup.position.x = -1.5 + (val * 0.005);
        }

        function completeInsertion() {
            if (gameState.angle >= 15 && gameState.angle <= 30) {
                gameState.score += 350;
                flashMesh.material.opacity = 0.9; // ظهور ومضة الدم الحمراء!
                gameState.step = 5;
                updateCloud('🎉 نجحت العملية بنجاح تام!', `مجموع نقاطك: ${gameState.score} نقطة. تم تأمين الخط الوريدي بمهارة عالية وإعطاء الإرواء المناسب لتجنب PONV.`);
                document.getElementById('action-controls').innerHTML = `<button class="btn" onclick="nextStep()">إعادة المحاكاة 🔄</button>`;
            } else {
                updateCloud('⚠️ زاوية خاطئة!', 'الزاوية إما حادة جداً (تخترق الجدار الخلفي) أو سطحية جداً. اضبطها بين 15° و 30°!');
            }
            document.getElementById('hud-score').innerText = gameState.score;
        }

        // --- 4. حلقة الرسم Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // التجاوب مع حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
