<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي زرق الكانيولا 3D | التحديث رقم 2 (Update #2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --cyan: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --panel: rgba(15, 23, 42, 0.92);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background-color: var(--bg); color: #f8fafc; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #canvas-container { position: absolute; inset: 0; z-index: 1; }

        /* شريط المراقبة الحيوية HUD */
        .hud {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 20px; background: var(--panel);
            backdrop-filter: blur(14px); border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .hud-item { font-size: 0.92rem; font-weight: 700; color: #94a3b8; }
        .hud-item span { color: var(--cyan); }

        /* غيمة الملاحظات الطافية (Floating Cloud Notification) */
        .cloud-notification {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(14px); border: 2px solid var(--cyan);
            padding: 12px 26px; border-radius: 22px; box-shadow: 0 10px 35px rgba(56, 189, 248, 0.3);
            text-align: center; max-width: 480px; animation: cloudPulse 2.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }
        .cloud-title { font-size: 1rem; font-weight: 900; color: var(--cyan); margin-bottom: 3px; }
        .cloud-desc { font-size: 0.86rem; color: #cbd5e1; line-height: 1.5; }

        @keyframes cloudPulse {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* لوحة التحكم السفلية */
        .controls-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: var(--panel); backdrop-filter: blur(18px);
            border: 1px solid rgba(56, 189, 248, 0.4); padding: 16px 28px; border-radius: 22px;
            display: flex; gap: 14px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.85);
            flex-wrap: wrap; justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, var(--cyan), #2563eb); color: #020617;
            border: none; padding: 11px 26px; border-radius: 50px; font-weight: 800; font-size: 0.95rem;
            cursor: pointer; transition: all 0.25s; box-shadow: 0 5px 20px rgba(56, 189, 248, 0.35);
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .slider-group { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: #94a3b8; }
        input[type="range"] { accent-color: var(--cyan); width: 150px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="hud">
        <div class="hud-item">المرحلة: <span id="hud-step">1 / 4</span></div>
        <div class="hud-item">النقاط العلمية: <span id="hud-score">0</span></div>
    </div>

    <!-- غيمة الملاحظات الطافية -->
    <div class="cloud-notification" id="cloud-box">
        <div class="cloud-title" id="cloud-title">المرحلة 1: تهيئة القفازات المعقمة 🧤</div>
        <div class="cloud-desc" id="cloud-desc">أهلاً بك في الإصدار رقم 2 (Update #2). انقر على الزر أدناه لارتداء القفازات وبدء إجراء التخدير القيصري.</div>
    </div>

    <!-- مسرح الـ 3D -->
    <div id="canvas-container"></div>

    <!-- لوحة التحكم -->
    <div class="controls-panel" id="action-controls">
        <button class="btn" id="action-btn" onclick="nextStep()">ارتداء القفازات الطبية 🧤</button>
    </div>

    <!-- مكتبة Three.js ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. بناء مشهد Three.js 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.FogExp2(0x030712, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.8, 6.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // إضاءة صالة العمليات الفضائية
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.4);
        dirLight.position.set(6, 12, 8);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x818cf8, 2, 12);
        pointLight.position.set(0, 3, 2);
        scene.add(pointLight);

        // --- 2. مجسم الذراع البشري والأوردة 3D ---
        const armGroup = new THREE.Group();
        scene.add(armGroup);

        // الساعد البشري
        const armGeo = new THREE.CylinderGeometry(0.75, 0.85, 4.8, 32);
        const armMat = new THREE.MeshStandardMaterial({ color: 0xdb9f7e, roughness: 0.55, metalness: 0.05 });
        const armMesh = new THREE.Mesh(armGeo, armMat);
        armMesh.rotation.z = Math.PI / 2;
        armMesh.castShadow = true;
        armMesh.receiveShadow = true;
        armGroup.add(armMesh);

        // التورنيكيه (يظهر بالمرحلة 2)
        const tournGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.35, 32);
        const tournMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2 });
        const tournMesh = new THREE.Mesh(tournGeo, tournMat);
        tournMesh.rotation.z = Math.PI / 2;
        tournMesh.position.x = 1.1;
        tournMesh.visible = false;
        armGroup.add(tournMesh);

        // الأوردة والشريان 3D (تفاعلية عبر Raycaster)
        const veinGroup = new THREE.Group();
        armGroup.add(veinGroup);

        const veinMat = new THREE.MeshBasicMaterial({ color: 0x2563eb });
        const arteryMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 }); // شريان خطير

        // الوريد الصحيح (Cephalic)
        const v1Geo = new THREE.CylinderGeometry(0.11, 0.11, 3.0, 16);
        const vein1 = new THREE.Mesh(v1Geo, veinMat);
        vein1.rotation.z = Math.PI / 2;
        vein1.position.set(-0.2, 0.32, 0);
        vein1.userData = { type: 'correct', name: 'الوريد الكعبري الساعدي (Cephalic Vein)' };
        veinGroup.add(vein1);

        // الشريان الخاطئ
        const artGeo = new THREE.CylinderGeometry(0.09, 0.09, 3.0, 16);
        const artery = new THREE.Mesh(artGeo, arteryMat);
        artery.rotation.z = Math.PI / 2;
        artery.position.set(-0.2, -0.32, 0);
        artery.userData = { type: 'wrong', name: 'الشريان الكعبري النابض (محظور!)' };
        veinGroup.add(artery);

        // السرنجة والكانيولا 3D
        const needleGroup = new THREE.Group();
        scene.add(needleGroup);
        needleGroup.visible = false;

        const nGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.6, 16);
        const nMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.95, roughness: 0.1 });
        const nMesh = new THREE.Mesh(nGeo, nMat);
        nMesh.rotation.z = Math.PI / 2;
        needleGroup.add(nMesh);

        // حجرة الـ Flashback (ومضة الدم)
        const fGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.45, 16);
        const fMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, transparent: true, opacity: 0.15 });
        const fMesh = new THREE.Mesh(fGeo, fMat);
        fMesh.rotation.z = Math.PI / 2;
        fMesh.position.x = 0.8;
        needleGroup.add(fMesh);

        // --- 3. حالة اللعبة والمنطق (State & Events) ---
        let game = {
            step: 1,
            score: 0,
            angle: 22,
            veinChosen: false
        };

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (game.step === 3) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(veinGroup.children);

                if (hits.length > 0) {
                    const hitObj = hits[0].object;
                    if (hitObj.userData.type === 'correct') {
                        game.veinChosen = true;
                        game.score += 300;
                        updateCloud('✔ اختيار وعائي سليم!', `تم جس وتحديد ${hitObj.userData.name} بنجاح. هذا الوريد ممتاز لإعطاء السوائل ومضاد الغثيان (PONV).`);
                        document.getElementById('action-btn').disabled = false;
                        document.getElementById('action-btn').innerText = "الانتقال لزاوية الوخز 📐";
                    } else {
                        updateCloud('🚨 تحذير سريري خطير!', `هذا هو ${hitObj.userData.name}! وعاء دموي شرياني نابض، يُمنع زرق الكانيولا فيه تماماً.`);
                    }
                }
            }
        });

        function updateCloud(title, desc) {
            document.getElementById('cloud-title').innerText = title;
            document.getElementById('cloud-desc').innerText = desc;
        }

        function nextStep() {
            if (game.step === 1) {
                game.score += 150;
                game.step = 2;
                updateCloud('المرحلة 2: ربط التورنيكيه 🎗️', 'تم ارتداء القفازات المعقمة. انقر على الزر لربط التورنيكيه 7–10 سم أعلى موقع البزل لإبراز الأوردة.');
                document.getElementById('action-btn').innerText = "ربط التورنيكيه 🎗️";
            } else if (game.step === 2) {
                tournMesh.visible = true;
                game.score += 150;
                game.step = 3;
                updateCloud('المرحلة 3: جس واختيار الوريد 🔍', 'انقر بالماوس أو الإصبع مباشرة على الوريد الصحيح (الأزرق العلوي) على ذراع المريضة 3D.');
                document.getElementById('action-btn').innerText = "اختر الوريد على الذراع 3D";
                document.getElementById('action-btn').disabled = true;
            } else if (game.step === 3) {
                game.step = 4;
                needleGroup.visible = true;
                updateCloud('المرحلة 4: زاوية الوخز ومراقبة الـ Flashback 📐', 'استخدم المنزلق أدناه لضبط زاوية الوخز بين 15° و 30° ثم اضغط إتمام الوخز.');
                document.getElementById('action-controls').innerHTML = `
                    <div class="slider-group">
                        <label>الزاوية: <b id="ang-txt" style="color:var(--cyan);">22°</b></label>
                        <input type="range" min="10" max="50" value="22" oninput="changeAngle(this.value)">
                    </div>
                    <button class="btn" onclick="executePuncture()">إتمام الوخز ومراقبة الـ Flashback 💉</button>
                `;
            } else if (game.step === 5) {
                location.reload();
            }

            document.getElementById('hud-step').innerText = Math.min(game.step, 4) + " / 4";
            document.getElementById('hud-score').innerText = game.score;
        }

        function changeAngle(val) {
            game.angle = Number(val);
            document.getElementById('ang-txt').innerText = val + "°";
            needleGroup.rotation.z = (val * Math.PI) / 180;
            needleGroup.position.x = -1.4 + (val * 0.004);
        }

        function executePuncture() {
            if (game.angle >= 15 && game.angle <= 30) {
                game.score += 400;
                fMesh.material.opacity = 0.92; // ظهور ومضة الدم الحمراء داخل الغرفة ثلاثية الأبعاد!
                game.step = 5;
                updateCloud('🎉 تمت عملية زرق الكانيولا بنجاح تام!', `مجموع نقاطك الكلي: ${game.score} نقطة. تم تأمين الخط الوريدي للعمليات القيصرية وإعطاء الإرواء بنجاح.`);
                document.getElementById('action-controls').innerHTML = `<button class="btn" onclick="nextStep()">إعادة المحاكاة الجديدة 🔄</button>`;
            } else {
                updateCloud('⚠️ زاوية إدخال خاطئة!', 'الزاوية غير مناسبة؛ الزاوية المثالية للاختراق الناجح يجب أن تكون بين 15° و 30°.');
            }
            document.getElementById('hud-score').innerText = game.score;
        }

        // --- 4. حلقة الرسم والاستجابة (Render Loop) ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
